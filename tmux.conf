# Configuración de tmux de Jimmy4TK
# https://github.com/Jimmy4TK/Tmux-Config

# ---- Atajos sin prefijo ----

# Ventanas y divisiones
bind -n M-c new-window
bind -n M-w kill-window
bind -n M-s split-window -h
bind -n M-S split-window -v

# Redimensionar paneles
bind -r -n M-Left  resize-pane -L 5
bind -r -n M-Down  resize-pane -D 5
bind -r -n M-Up    resize-pane -U 5
bind -r -n M-Right resize-pane -R 5

# Moverse entre paneles
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Ir a una ventana
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 0

# Recargar esta configuración
bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Gestor de plugins
bind-key -n M-i run-shell ~/.config/tmux/plugins/tpm/bindings/install_plugins
bind-key -n M-u run-shell ~/.config/tmux/plugins/tpm/bindings/update_plugins
bind-key -n M-U run-shell ~/.config/tmux/plugins/tpm/bindings/clean_plugins

# ---- Modo copia ----

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi Home send-keys -X start-of-line
bind-key -T copy-mode-vi End  send-keys -X end-of-line

# ---- Opciones generales ----

set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ",xterm-kitty:RGB"
set-option -g set-clipboard on
set-option -g mouse on

# Numerar ventanas y paneles desde 1
set-option -g base-index 1
set-window-option -g pane-base-index 1

# ---- Tema: paleta Rosé Pine sobre fondo transparente ----
# Base: #191724 base · #26233a overlay · #908caa subtle
# Acentos: #ebbcba rose · #c4a7e7 iris · #9ccfd8 foam · #f6c177 gold

set-option -g status on
set-option -g status-position bottom
set-option -g status-interval 2
set-option -g status-style "bg=default,fg=#908caa"

# Una píldora con todas las ventanas y otra con el programa actual y la ruta.
# En Neovim, lua/config/tmux.lua de Nvim-Config informa el tipo de archivo en @nvim_filetype.
set-option -g status-left ""
set-option -g status-left-style "default"
set-option -g status-right-length 120
set-option -g status-right-style "default"
set-option -g status-right "#[fg=#26233a]#[bg=default]#[bg=#26233a]#[fg=#9ccfd8] #{?#{&&:#{@nvim_filetype},#{==:#{pane_current_command},nvim}},#{@nvim_filetype},#{pane_current_command}} #[fg=#6e6a86]#[bg=#26233a]|#[fg=#f6c177] #{s|^#{HOME}|~|:pane_current_path} #[fg=#26233a]#[bg=default]#[default] "

# Los extremos de la píldora se dibujan en la primera y la última ventana.
set-option -g window-status-separator ""
set-window-option -g window-status-style "default"
set-window-option -g window-status-activity-style "default"
set-window-option -g window-status-current-style "default"
set-window-option -g window-status-format "#{?window_start_flag,#[fg=#26233a]#[bg=default],}#[bg=#26233a]#[fg=#908caa]#[nobold] #I #W #[nobold]#{?window_end_flag,#[fg=#26233a]#[bg=default]#[default],#[fg=#6e6a86]#[bg=#26233a]|}"
set-window-option -g window-status-current-format "#{?window_start_flag,#[fg=#26233a]#[bg=default],}#[bg=#26233a]#[fg=#c4a7e7]#[bold] #I #W #[nobold]#{?window_end_flag,#[fg=#26233a]#[bg=default]#[default],#[fg=#6e6a86]#[bg=#26233a]|}"

# Bordes, mensajes, selección y reloj
set-option -g pane-border-style "fg=#26233a"
set-option -g pane-active-border-style "fg=#c4a7e7"
set-option -g message-style "bg=#f6c177,fg=#191724,bold"
set-window-option -g mode-style "bg=#c4a7e7,fg=#191724"
set-window-option -g clock-mode-colour "#ebbcba"

# ---- Plugins ----

set-option -g @plugin 'tmux-plugins/tpm'
set-option -g @plugin 'tmux-plugins/tmux-yank'

# El gestor de plugins tiene que cargarse al final de este archivo.
run-shell '~/.config/tmux/plugins/tpm/tpm'
